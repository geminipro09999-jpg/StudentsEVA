name: Supabase Database Backup

on:
  schedule:
    # Runs at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Dump Supabase Database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Error: SUPABASE_DB_URL secret is not set in GitHub Settings!"
            exit 1
          fi
          echo "Starting Supabase database dump..."
          pg_dump "$(echo -n "$SUPABASE_DB_URL")" > supabase-backup.sql

      - name: Upload Database Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup-${{ github.run_id }}
          path: supabase-backup.sql
          retention-days: 90 # The backup will be kept for 90 days in GitHub
