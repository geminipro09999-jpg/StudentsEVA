name: Supabase Database Backup

on:
  schedule:
    # Runs at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 17 Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get remove -y postgresql-client* || true
          sudo apt-get install -y postgresql-client-17
          echo "pg_dump version: $(/usr/lib/postgresql/17/bin/pg_dump --version)"

      - name: Dump Supabase Database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Error: SUPABASE_DB_URL secret is not set in GitHub Settings!"
            exit 1
          fi
          echo "Starting Supabase database dump..."
          /usr/lib/postgresql/17/bin/pg_dump "$(echo -n "$SUPABASE_DB_URL")" > supabase-backup.sql
          echo "Database dump completed successfully!"

      - name: Upload Database Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup-${{ github.run_id }}
          path: supabase-backup.sql
          retention-days: 90 # The backup will be kept for 90 days in GitHub
